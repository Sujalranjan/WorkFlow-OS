# Alembic settings for developers creating new migrations:
#   cd backend
#   alembic revision --autogenerate -m "describe the change"
# Review the generated file in app/migrations/versions before committing it.
# Applying migrations: python -m app.cli db upgrade (the API also does this on start).
# The database comes from DATABASE_URL / DATABASE_PATH, like the app.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
