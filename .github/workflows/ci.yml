name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test_database_url: ""
          - database: postgres
            test_database_url: postgresql+psycopg://wfos:wfos@localhost:5432/wfos_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfos
          POSTGRES_PASSWORD: wfos
          POSTGRES_DB: wfos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r desktop-agent/requirements.txt
      - name: Run pytest
        # Live Gemini/Slack/Gmail tests are skipped: no secrets are configured in CI.
        # The postgres leg runs the same suite with every test database as a Postgres schema.
        env:
          WORKFLOWOS_TEST_DATABASE_URL: ${{ matrix.test_database_url }}
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Check the browser extension
        # manifest is valid, names only existing files, and every script parses
        run: node ../scripts/check_extension.mjs

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and check health
        run: |
          mkdir -p secrets
          # Postgres, API, worker, Demo CRM, dashboard
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/api/crm/health && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:5173/
          # Protected routes reject anonymous callers...
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/status)" = "401"
          # ...and work after signing in as an admin created with the CLI.
          docker compose exec -T -e WORKFLOWOS_NEW_PASSWORD=ci-admin-password api             python -m app.cli create-user --email ci@example.com --name CI --role admin
          curl -sf -c jar -H 'Content-Type: application/json'             -d '{"email":"ci@example.com","password":"ci-admin-password"}' http://localhost:8000/api/auth/login
          curl -sf -b jar http://localhost:8000/api/status
      - name: Database and worker
        run: |
          # The API migrated Postgres on start; the schema must match the code exactly.
          docker compose exec -T api python -m app.cli db current
          docker compose exec -T api python -m app.cli db check
          test "$(docker compose ps --status running --services | grep -c '^worker$')" = "1"
          # Queue a dry run through the API and wait for the worker container to finish it.
          python3 scripts/smoke_test.py --api http://localhost:8000 --email ci@example.com --password ci-admin-password
      - name: Worker stops gracefully
        run: |
          docker compose stop -t 60 worker
          docker compose logs worker | grep -q "stopped"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
