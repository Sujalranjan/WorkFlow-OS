name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop-agent/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r desktop-agent/requirements.txt
      - name: Run pytest
        # Live Gemini/Slack/Gmail tests are skipped: no secrets are configured in CI.
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and check health
        run: |
          mkdir -p secrets
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:8001/api/crm/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/status
          curl -sf -o /dev/null http://localhost:5173/
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
