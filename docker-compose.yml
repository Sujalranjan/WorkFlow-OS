# Runs the WorkFlowOS API, the Demo CRM and the dashboard.
#   docker compose up --build
# Host ports are configurable (e.g. when 8000 is taken): API_PORT=8010 WEB_PORT=5180 docker compose up --build
# After changing API_PORT, use --build: the dashboard image has the API address built in.
# Dashboard: http://localhost:5173   API: http://localhost:8000/docs   CRM UI: http://localhost:8001/ui/customers
#
# Create the first admin once:
#   docker compose exec api python -m app.cli create-user --email you@example.com --name "You" --role admin
#
# Integrations are read from .env (optional). For Gmail, put credentials.json and token.json in ./secrets
# (create token.json on your machine first; the OAuth sign-in opens a browser and cannot run in a container).
# The desktop agent and browser extension still run on your machine and report to http://localhost:8000.

services:
  crm:
    build: ./backend
    command: ["uvicorn", "app.crm_server:crm_app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      HEALTH_URL: http://127.0.0.1:8001/api/crm/health
    ports:
      - "${CRM_PORT:-8001}:8001"
    volumes:
      - workflowos-data:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Paths and service addresses inside the containers (override anything in .env).
      DATABASE_PATH: /data/workflowos.db
      WORKFLOWOS_SANDBOX_DIR: /data/sandbox
      GMAIL_CREDENTIALS_PATH: /secrets/credentials.json
      GMAIL_TOKEN_PATH: /secrets/token.json
      CRM_API_BASE_URL: http://crm:8001/api/crm
      LOG_FORMAT: json
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}}
      # Address of the API in the user's browser (Gmail OAuth redirect URI is built from it)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - workflowos-data:/data
      - ./secrets:/secrets
    depends_on:
      crm:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  workflowos-data:
