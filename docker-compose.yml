# Runs Postgres, the WorkFlowOS API, the background worker, the Demo CRM and the dashboard.
#   docker compose up --build
# Host ports are configurable (e.g. when 8000 is taken): API_PORT=8010 WEB_PORT=5180 docker compose up --build
# After changing API_PORT, use --build: the dashboard image has the API address built in.
# Dashboard: http://localhost:5173   API: http://localhost:8000/docs   CRM UI: http://localhost:8001/ui/customers
#
# Create the first admin once:
#   docker compose exec api python -m app.cli create-user --email you@example.com --name "You" --role admin
#
# Connect Gmail and Slack in the dashboard (Settings > Integrations). Other settings come from .env.
# The desktop agent and browser extension still run on your machine and report to http://localhost:8000.
#
# Data: WorkFlowOS data lives in Postgres (volume workflowos-pg). The data volume (workflowos-data) keeps
# the credential encryption key, the execution sandbox and the Demo CRM. Back up both volumes, and keep
# the key: without it, saved integrations must be connected again.
# Upgrading from a version that stored everything in SQLite (/data/workflowos.db)? Copy it in once:
#   docker compose exec api python -m app.cli db import-sqlite /data/workflowos.db
# Set POSTGRES_PASSWORD in .env before the first start (it is fixed once the database is created).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflowos
      POSTGRES_DB: workflowos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflowos}
    volumes:
      - workflowos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowos -d workflowos"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host. To reach it from your machine (e.g. for backups with pg_dump), add:
    # ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped

  crm:
    build: ./backend
    command: ["uvicorn", "app.crm_server:crm_app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      HEALTH_URL: http://127.0.0.1:8001/api/crm/health
    ports:
      - "${CRM_PORT:-8001}:8001"
    volumes:
      - workflowos-data:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Paths and service addresses inside the containers (override anything in .env).
      DATABASE_URL: postgresql+psycopg://workflowos:${POSTGRES_PASSWORD:-workflowos}@postgres:5432/workflowos
      # Not used for data while DATABASE_URL is set; it is the source for `db import-sqlite`.
      DATABASE_PATH: /data/workflowos.db
      SECRET_KEY_PATH: /data/workflowos.secret.key
      # Jobs (runs, verification, email polling) are done by the `worker` service below.
      EMBEDDED_WORKER: "false"
      WORKFLOWOS_SANDBOX_DIR: /data/sandbox
      GMAIL_CREDENTIALS_PATH: /secrets/credentials.json
      GMAIL_TOKEN_PATH: /secrets/token.json
      CRM_API_BASE_URL: http://crm:8001/api/crm
      LOG_FORMAT: json
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:${WEB_PORT:-5173},http://127.0.0.1:${WEB_PORT:-5173}}
      # Address of the API in the user's browser (Gmail OAuth redirect URI is built from it)
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - workflowos-data:/data
      - ./secrets:/secrets
    depends_on:
      postgres:
        condition: service_healthy
      crm:
        condition: service_healthy
    restart: unless-stopped

  # Runs queued jobs: workflow executions, verification and email-trigger polling. Same image and
  # settings as the API. Scale with `docker compose up -d --scale worker=2` (each job runs once).
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://workflowos:${POSTGRES_PASSWORD:-workflowos}@postgres:5432/workflowos
      DATABASE_PATH: /data/workflowos.db
      SECRET_KEY_PATH: /data/workflowos.secret.key
      WORKFLOWOS_SANDBOX_DIR: /data/sandbox
      GMAIL_CREDENTIALS_PATH: /secrets/credentials.json
      GMAIL_TOKEN_PATH: /secrets/token.json
      CRM_API_BASE_URL: http://crm:8001/api/crm
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
      LOG_FORMAT: json
    volumes:
      - workflowos-data:/data
      - ./secrets:/secrets
    # No HTTP endpoint: override the image's API health check with a process check.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/cmdline') else 1)"]
      interval: 30s
    # Finish the job in hand before stopping.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      crm:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  workflowos-data:
  workflowos-pg:
